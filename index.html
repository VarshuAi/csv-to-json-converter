<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV to JSON Converter — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">📊</span>
                <div class="title-col">
                    <h1>CSV to JSON Converter</h1>
                    <p class="tagline">Fast browser parsing converting CSV lines to structured JSON datasets.</p>
                </div>
            </div>
            <div class="badge">data</div>
        </header>

        <main class="workspace-card">
            
            <textarea id="csv-inp" placeholder="name,age,role\nVarshan,21,Dev\nJohn,30,Manager" style="width:100%; height:120px;"></textarea>
            <button class="btn" style="margin: 12px 0;" onclick="parseCSV()">Compile JSON</button>
            <textarea id="csv-json-out" readonly style="width:100%; height:120px; font-family:monospace;"></textarea>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
